name: canary-stack
services:
  localstack:
      image: localstack/localstack
      container_name: localstack-canary
      ports:
        - "4566:4566"            # LocalStack Gateway
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/init || exit 1"]
        interval: 5s
        timeout: 5s
        retries: 5
      environment:
        - SERVICES=s3            # We only need S3 for now
        - DEBUG=1
      volumes:
        - "./ls-data:/var/lib/localstack"
  health_db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    container_name: pg-canary
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-canary
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build: .
    container_name: canary-worker
    env_file:
      - ./.env
    environment:
      - ConnectionStrings__HealthDatabase=Host=health_db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT}
    depends_on:
      localstack:
        condition: service_healthy
      health_db:
        condition: service_healthy

  

volumes:
  pg-data: